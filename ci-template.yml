# ==============================================================================
# 🌟 UNIVERSAL CI PIPELINE TEMPLATE FOR FULL-STACK FASTAPI + REACT PROJECTS
# ==============================================================================
# How to use:
# 1. Copy this file to `.github/workflows/ci.yml` in any full-stack repository.
# 2. No GitHub Secrets are required!
# 3. Gives you 3 clean Green Checks on every push:
#    ✓ Backend Tests & Validation
#    ✓ Frontend Build Check
#    ✓ Validate Docker Compose Configuration
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. BACKEND VALIDATION: Python dependencies, environment, and startup check
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: ci-secret-key-super-secure-32chars-for-test

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate FastAPI Backend Startup
        run: |
          python -c "import app.main; print('FastAPI Backend successfully loaded and validated!')"

  # ----------------------------------------------------------------------------
  # 2. FRONTEND BUILD CHECK: Node dependencies, ESLint, and Vite build
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend Distribution Bundle
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  # ----------------------------------------------------------------------------
  # 3. DOCKER VALIDATION: Docker Compose syntax and service structure check
  # ----------------------------------------------------------------------------
  docker:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Create dummy env file for validation
        run: |
          mkdir -p backend
          touch backend/.env

      - name: Validate Docker Compose Config
        run: docker compose config
